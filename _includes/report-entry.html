<section class="post-cards">
  <div class="card-grid">

    <div class="card report-card" id="{{ entry.slug }}">
      <div class="card-content">
        <strong>{{ entry.name }}, {{ entry.affiliation }}</strong>

        <h3><em>Activity: {{ entry.placement }}</em></h3>

        <div class="card-excerpt">
          {{ entry.content }}
        </div>
      </div>
    </div>

  </div>
</section>
